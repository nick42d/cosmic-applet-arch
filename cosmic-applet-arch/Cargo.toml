[package]
name = "cosmic-applet-arch"
version = "1.1.2"
edition = "2021"
license = "GPL-3.0"
rust-version = "1.85"

[dependencies]
chrono = "0.4.45"
futures = "0.3.34"
i18n-embed-fl = "0.10.1"
itertools = "0.15.0"
open = "5.4.5"
rust-embed = "8.13.0"
tokio = { version = "1.54.1", features = ["full"] }
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.2.1"
ron = { version = "0.12.3", optional = true }
rss = "2.1.2"
reqwest = "0.13.5"
tokio-stream = { version = "0.1.19", features = ["io-util"] }
directories = "6.0.0"
anyhow = "1.0.104"
rustix = {version = "1.1.6", features = ["fs"]}

[dependencies.libcosmic]
git = "https://github.com/pop-os/libcosmic.git"
# To keep builds reproducible, libcosmic should be pegged to a rev.
# This should be updated periodically.
# 19/10/26 - last commit before epoch 1.11.0
rev = "430f3d4"
default-features = false
features = ["applet", "tokio", "wayland", "autosize"]

[dependencies.i18n-embed]
version = "0.16"
features = ["fluent-system", "desktop-requester"]

[dependencies.arch-updates-rs]
path = "../arch-updates-rs"

# Uncomment to test a locally-cloned libcosmic
# [patch.'https://github.com/pop-os/libcosmic']
# libcosmic = { path = "../libcosmic" }
# cosmic-config = { path = "../libcosmic/cosmic-config" }
# cosmic-theme = { path = "../libcosmic/cosmic-theme" }

[features]
# Feature to use mock version of API instead of real version - for testing.
mock-api = ["ron", "chrono/serde"]

[dev-dependencies]
mockall = "0.15.0"
tempfile = "3.27.0"
