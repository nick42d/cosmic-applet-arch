[package]
name = "arch-updates-rs"
version = "0.3.1"
edition = "2021"
license = "GPL-3.0"
description = "Library to query arch linux packaging tools to see if updates are available."
homepage = "https://github.com/nick42d/cosmic-applet-arch"
repository = "https://github.com/nick42d/cosmic-applet-arch"
readme = "README.md"

[dependencies]
futures = "0.3.34"
raur = "8.0.0"
reqwest = "0.13.4"
srcinfo = "2.1.0"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["process"] }
version-compare = "0.2.1"

[dev-dependencies]
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
